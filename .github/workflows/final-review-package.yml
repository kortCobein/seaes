name: Preparar integración SEAES y fuente revisable
on:
  push:
    branches:
      - fix/integracion-final-ut-svg-20261012
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar código fuente completo
        run: git archive --format=zip -o source-repo.zip HEAD
      - name: Empaquetar versión main para reconciliación
        run: |
          git fetch origin main
          git archive --format=zip -o main-repo.zip origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: seaes-main-original
          path: main-repo.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: seaes-fuente-integracion
          path: source-repo.zip
          retention-days: 7
      - name: Empaquetar ancestro común para fusión de tres vías
        run: git archive --format=zip -o base-repo.zip fba621152cc361ed808e6387192156051f1b939d
      - uses: actions/upload-artifact@v4
        with:
          name: seaes-ancestro-comun
          path: base-repo.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: seaes-integracion-dist
          path: dist/
          retention-days: 14
