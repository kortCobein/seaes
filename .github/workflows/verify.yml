name: Verificar SEAES

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript y compilar
        run: npm run build

      - name: Ejecutar pruebas de Excel
        run: npm test

      - name: Sincronizar dist comprobado
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A dist
            git commit -m "build: publicar dist verificado"
            git push origin HEAD:main
          fi

      - name: Guardar sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: seaes-utsjr-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
