name: Compilar dist temporal Codex
on:
  push:
    branches: [fix/codex-wip-build-only, style/codex-wip-motion-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Comprobar salida de produccion
        run: |
          test -s dist/index.html
          test -d dist/assets
          test -d dist/data
      - uses: actions/upload-artifact@v4
        with:
          name: seaes-codex-wip-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
